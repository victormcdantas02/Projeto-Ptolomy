<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ptolomy.AI — Checagem de fatos</title>
<meta name="description" content="Ptolomy.AI: plataforma acadêmica de checagem de fatos que verifica afirmações e respostas de IA, com score de confiabilidade e evidências.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='38' r='20' fill='%23f3e6c4' stroke='%230f1f3d' stroke-width='3'/%3E%3Cpath d='M8 20 32 10 56 20 32 30Z' fill='%230f1f3d'/%3E%3Ccircle cx='39' cy='38' r='6' fill='none' stroke='%23c9a227' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0f1f3d; --navy-2:#1b2f57; --navy-3:#2a4378;
  --gold:#c9a227; --gold-2:#e6c65c; --gold-soft:#f7eed2;
  --bg:#f6f4ee; --surface:#ffffff; --ink:#14213d; --muted:#545e73; --line:#e3dfd3;
  --c-verde:#1e9e5f; --c-amarelo:#e0a800; --c-vermelho:#d64545;
  --t-verde:#156b41; --t-amarelo:#7a5600; --t-vermelho:#a32020;
  --b-verde:#e3f4ea; --b-amarelo:#fff4d1; --b-vermelho:#fde8e6;
  --radius:14px; --shadow:0 1px 2px rgba(15,31,61,.06),0 8px 24px rgba(15,31,61,.06);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
#app{flex:1;display:flex;flex-direction:column}
svg{max-width:100%}
a{color:var(--navy-3)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:4px}
.skip{position:absolute;left:-9999px;top:8px;background:var(--navy);color:#fff;padding:10px 14px;z-index:200;border-radius:8px}
.skip:focus{left:8px}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0;margin:-1px}

/* Cabeçalho */
header.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:30;border-bottom:3px solid var(--gold)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;position:relative}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-family:var(--serif);font-weight:700;font-size:1.3rem;white-space:nowrap}
.brand .ai{color:var(--gold-2)}
.brand svg{background:#fff;border-radius:50%;padding:2px}
nav.main{display:flex;gap:2px;margin-left:auto;align-items:center}
nav.main a,nav.main button.navbtn{color:#dfe5f2;text-decoration:none;padding:8px 12px;border-radius:999px;font-weight:500;font-size:.95rem;background:none;border:0;font-family:inherit;cursor:pointer;min-height:40px;display:inline-flex;align-items:center}
nav.main a[aria-current=page]{background:rgba(255,255,255,.14);color:#fff}
nav.main a:hover,nav.main button.navbtn:hover{color:#fff;background:rgba(255,255,255,.08)}
.user-chip{display:inline-flex;align-items:center;gap:8px;margin-left:8px;padding-left:12px;border-left:1px solid rgba(255,255,255,.18)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--gold);color:var(--navy);font-weight:700;display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;flex:none}
.menu-toggle{display:none;margin-left:auto;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer;min-height:40px}
@media (max-width:900px){
  .menu-toggle{display:inline-flex}
  nav.main{display:none;position:absolute;top:100%;left:0;right:0;background:var(--navy);flex-direction:column;align-items:stretch;padding:8px 16px 16px;border-bottom:3px solid var(--gold)}
  nav.main.open{display:flex}
  .user-chip{margin:8px 0 0;padding:12px 0 0;border-left:0;border-top:1px solid rgba(255,255,255,.18)}
}
.demo-banner{background:var(--gold-soft);color:#5a4500;font-size:.85rem;text-align:center;padding:6px 16px;border-bottom:1px solid #ead9a0}

main{max-width:1180px;width:100%;margin:0 auto;padding:28px 16px 64px;flex:1}
h1,h2,h3{font-family:var(--serif);color:var(--navy);line-height:1.2;margin:0 0 .45em}
h1{font-size:clamp(1.6rem,3.2vw,2.25rem)} h2{font-size:1.35rem} h3{font-size:1.08rem}
h1:focus{outline:none}
p{margin:0 0 .8em}
.lead{color:var(--muted);margin:0 0 22px;max-width:72ch;font-size:1.03rem}
.page-head{margin-bottom:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;min-width:0}
.stack>*+*{margin-top:16px}
.small{font-size:.9rem}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:.86rem;margin-top:4px}
.row-between{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
footer.foot{border-top:1px solid var(--line);color:var(--muted);font-size:.85rem;text-align:center;padding:18px 16px}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;min-height:44px;line-height:1.2;transition:background .15s}
.btn-primary{background:var(--navy);color:#fff}.btn-primary:hover{background:var(--navy-2)}
.btn-gold{background:var(--gold);color:var(--navy)}.btn-gold:hover{background:var(--gold-2)}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--navy)}.btn-ghost:hover{background:#f3f0e7}
.btn-danger{background:#b42318;color:#fff}.btn-danger:hover{background:#951c13}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn-sm{padding:6px 12px;min-height:36px;font-size:.88rem}
.w100{width:100%}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:.86rem;cursor:pointer;color:var(--navy-2);text-align:left}
.chip:hover{border-color:var(--gold);background:var(--gold-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}

/* Formulários */
label{display:block;font-weight:600;margin-bottom:6px;font-size:.95rem}
.field{margin-bottom:16px}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid #c9c4b3;border-radius:10px;background:#fff;color:var(--ink);min-height:44px}
textarea{min-height:150px;resize:vertical}
input[type=checkbox]{width:auto;min-height:auto;accent-color:var(--navy)}
[aria-invalid=true]{border-color:#b42318;box-shadow:0 0 0 1px #b42318}
.err{color:#a32020;font-size:.87rem;margin-top:4px;min-height:0}
.err:empty{display:none}
.form-msg:empty{display:none}
.form-msg{margin-bottom:14px}
.check-row{display:flex;gap:8px;align-items:center}
.check-row label{margin:0;font-weight:500}

/* Login */
.auth-wrap{display:grid;grid-template-columns:1.1fr 1fr;gap:32px;align-items:center;max-width:1000px;margin:8px auto}
@media (max-width:820px){.auth-wrap{grid-template-columns:1fr}}
.auth-hero .mascot-wrap{width:96px;height:96px;border-radius:50%;background:#fff;border:3px solid var(--gold);display:flex;align-items:center;justify-content:center;margin-bottom:18px;box-shadow:var(--shadow)}
.ticks{list-style:none;padding:0;margin:0}
.ticks li{padding-left:28px;position:relative;margin-bottom:8px}
.ticks li::before{content:"✓";position:absolute;left:0;top:0;width:20px;height:20px;border-radius:50%;background:var(--navy);color:var(--gold-2);font-size:.75rem;display:flex;align-items:center;justify-content:center;font-weight:700;margin-top:2px}
.demo-cred{margin-top:18px;background:#f3f5fa;border:1px dashed #b9c4dc;border-radius:12px;padding:12px 14px;font-size:.88rem}
.demo-cred code{background:#fff;padding:1px 6px;border-radius:6px;border:1px solid #dde3ef}

/* Badges, pills, alertas */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:999px;background:#eef1f7;color:var(--navy-2);border:1px solid #dde3ef;white-space:nowrap}
.badge.sens{background:var(--gold-soft);color:#5a4500;border-color:#e7d38b}
.badge.oficial{background:#e7ecf8;color:var(--navy);border-color:#c5d0ea}
.badge.academica{background:#efe9fb;color:#45317a;border-color:#d8ccf2}
.badge.imprensa{background:#e9f3f7;color:#1d4e60;border-color:#c6e0ea}
.badge.outra{background:#f1f1f1;color:#4a4a4a;border-color:#ddd}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:.84rem;font-weight:600;border:1px solid;white-space:nowrap}
.pill strong{font-size:.95rem}
.p-verde{background:var(--b-verde);color:var(--t-verde);border-color:#a8dcc0}
.p-amarelo{background:var(--b-amarelo);color:var(--t-amarelo);border-color:#efd27c}
.p-vermelho{background:var(--b-vermelho);color:var(--t-vermelho);border-color:#f1b3ac}
.alert{border-radius:12px;padding:14px 16px;border:1px solid;display:flex;gap:12px;align-items:flex-start}
.alert .ic{font-size:1.15rem;line-height:1.3;flex:none}
.alert p{margin:0}
.alert strong{display:block;margin-bottom:2px}
.alert-warn{background:var(--b-amarelo);border-color:#efd27c;color:#4f3800}
.alert-danger{background:var(--b-vermelho);border-color:#f1b3ac;color:#6f150d}
.alert-info{background:#eaf0fb;border-color:#c9d6f0;color:#1b2f57}
.alert-ok{background:var(--b-verde);border-color:#a8dcc0;color:#0f4d2e}

/* Checagem */
.steps{display:flex;gap:8px;list-style:none;padding:0;margin:0 0 18px;flex-wrap:wrap;counter-reset:s}
.steps li{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--muted);background:#fff;border:1px solid var(--line);padding:6px 12px 6px 6px;border-radius:999px}
.steps li .n{width:24px;height:24px;border-radius:50%;background:#ece8dc;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem}
.steps li.on{color:var(--navy);border-color:var(--gold)}
.steps li.on .n{background:var(--navy);color:var(--gold-2)}
.check-grid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:18px;align-items:start}
@media (max-width:900px){.check-grid{grid-template-columns:1fr}}
.revisao{background:#f8f6ef;border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:4px}
blockquote.texto{margin:0 0 4px;padding:12px 14px;border-left:4px solid var(--gold);background:#fffdf6;border-radius:0 10px 10px 0;white-space:pre-wrap;word-break:break-word}
.how ol{padding-left:20px;margin:0}
.how li{margin-bottom:8px}
#saida{margin-top:22px}

/* Resultado */
.result{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:18px;align-items:start}
@media (max-width:900px){.result{grid-template-columns:1fr}}
.score-card{text-align:center;border-top:6px solid var(--muted)}
.score-card.cor-verde{border-top-color:var(--c-verde)}
.score-card.cor-amarelo{border-top-color:var(--c-amarelo)}
.score-card.cor-vermelho{border-top-color:var(--c-vermelho)}
.gauge{width:220px;max-width:100%;display:block;margin:0 auto}
.score-label{font-weight:700;font-size:1.08rem;display:inline-flex;gap:8px;align-items:center;margin:4px 0 10px}
.score-label.verde{color:var(--t-verde)}.score-label.amarelo{color:var(--t-amarelo)}.score-label.vermelho{color:var(--t-vermelho)}
.ic-circle{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:.9rem;font-weight:800}
.ic-verde{background:var(--c-verde)}.ic-amarelo{background:var(--c-amarelo);color:#3a2a00}.ic-vermelho{background:var(--c-vermelho)}
.fatores{list-style:none;padding:0;margin:0}
.fatores li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:.93rem}
.fatores li:last-child{border-bottom:0}
.fatores .v{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.v.pos{color:var(--t-verde)}.v.neg{color:var(--t-vermelho)}.v.neu{color:var(--muted)}
.ev-list{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.ev{border:1px solid var(--line);border-left:6px solid #8d96a8;border-radius:12px;padding:14px 16px;background:#fff}
.ev.confirma{border-left-color:var(--c-verde)}
.ev.contradiz{border-left-color:var(--c-vermelho)}
.ev-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap;margin-bottom:4px}
.ev-top strong{font-size:1rem}
.ev a.dom{font-size:.88rem;word-break:break-all}
.ev p{margin:8px 0;font-size:.95rem}
.ev-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--muted);align-items:center}
.pos-tag{font-weight:700;font-size:.82rem;display:inline-flex;gap:5px;align-items:center}
.pos-tag.confirma{color:var(--t-verde)}.pos-tag.contradiz{color:var(--t-vermelho)}.pos-tag.neutra{color:var(--muted)}
.nota{font-size:.84rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:14px}

/* Skeleton */
.skeleton{background:linear-gradient(90deg,#ece9e0 25%,#f6f4ee 50%,#ece9e0 75%);background-size:200% 100%;animation:sk 1.2s infinite linear;border-radius:8px}
@keyframes sk{to{background-position:-200% 0}}
.sk-line{height:14px;margin:10px 0}

/* Histórico */
.filtros summary{cursor:pointer;font-weight:600;color:var(--navy);min-height:28px}
.filtros-grid{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:12px;align-items:end;margin-top:14px}
.filtros-grid .field{margin:0}
@media (max-width:820px){.filtros-grid{grid-template-columns:1fr}}
.hist-list{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:10px}
.hist-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:#fff;text-decoration:none;color:inherit}
.hist-item:hover{border-color:var(--gold);box-shadow:var(--shadow)}
.hi-txt{display:flex;flex-direction:column;min-width:0}
.hi-trecho{font-weight:500;overflow-wrap:anywhere}
.hi-meta{font-size:.82rem;color:var(--muted);margin-top:2px}
.hi-go{font-size:1.4rem;color:var(--muted)}
@media (max-width:600px){.hist-item{grid-template-columns:1fr}.hi-go{display:none}}
.pag{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:18px;flex-wrap:wrap}

/* Painel */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi .n{font-family:var(--serif);font-size:2rem;color:var(--navy);font-weight:700;line-height:1.1}
.kpi .l{color:var(--muted);font-size:.88rem}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.charts .wide{grid-column:1/-1}
@media (max-width:860px){.charts{grid-template-columns:1fr}}
figure{margin:0}
figcaption{font-family:var(--serif);color:var(--navy);font-weight:700;font-size:1.05rem;margin-bottom:4px}
.chart-sub{color:var(--muted);font-size:.84rem;margin-bottom:12px}
.donut-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.donut{width:170px;height:170px;flex:none}
.legend{list-style:none;padding:0;margin:0;display:grid;gap:8px;font-size:.92rem}
.legend li{display:flex;gap:8px;align-items:center}
.sw{width:14px;height:14px;border-radius:4px;flex:none}
.bars{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:110px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:.9rem}
.bar-track{background:#efece3;border-radius:999px;height:14px;overflow:hidden}
.bar-fill{display:block;height:100%;background:linear-gradient(90deg,var(--navy),var(--navy-3));border-radius:999px}
.bar-val{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.chart-svg{width:100%;height:auto;display:block}
details.dados{margin-top:12px;font-size:.88rem}
details.dados summary{cursor:pointer;color:var(--navy-3);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;margin-bottom:18px}
.seg button{border:0;background:#fff;padding:10px 16px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;min-height:42px}
.seg button[aria-pressed=true]{background:var(--navy);color:#fff}

/* Tabelas */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:.92rem;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
@media (max-width:720px){
  table.resp thead{display:none}
  table.resp tr{display:block;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:6px 10px;background:#fff}
  table.resp td{display:flex;justify-content:space-between;gap:12px;border:0;padding:6px 0;text-align:right}
  table.resp td::before{content:attr(data-label);font-weight:600;color:var(--muted);text-align:left}
  table.resp td.acoes{justify-content:flex-end;flex-wrap:wrap}
  table.resp td.acoes::before{content:none}
}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 16px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;min-height:44px}
.tabs button[aria-selected=true]{color:var(--navy);border-bottom-color:var(--gold)}

/* Vazio */
.empty{text-align:center;padding:36px 20px}
.empty .mascot-wrap{width:84px;height:84px;margin:0 auto 12px;border-radius:50%;background:#fff;border:3px solid var(--gold);display:flex;align-items:center;justify-content:center}
.empty p{color:var(--muted);max-width:52ch;margin:0 auto 14px}

/* Perfil */
dl.info{display:grid;grid-template-columns:max-content 1fr;gap:8px 18px;margin:0}
dl.info dt{color:var(--muted);font-weight:600}
dl.info dd{margin:0;overflow-wrap:anywhere}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.danger-zone{border-color:#f1b3ac}

/* Toast e modal */
#toasts{position:fixed;bottom:16px;right:16px;left:16px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;z-index:300;pointer-events:none}
.toast{pointer-events:auto;background:var(--navy);color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:420px;border-left:5px solid var(--gold);font-size:.93rem}
.toast.erro{border-left-color:var(--c-vermelho)}
.toast.ok{border-left-color:var(--c-verde)}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,40,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:250}
.modal{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h2{margin-bottom:10px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<a class="skip" href="#main">Pular para o conteúdo</a>
<noscript><p style="padding:20px">A Ptolomy.AI precisa de JavaScript ativado para funcionar.</p></noscript>
<div id="app"></div>
<div id="anuncio" class="sr-only" aria-live="polite" aria-atomic="true"></div>
<div id="toasts"></div>

<script>
'use strict';
/* =========================================================================
   Ptolomy.AI — protótipo acadêmico (front-end puro, um único arquivo)
   - Dados salvos no navegador (localStorage), simulando as tabelas:

/* ---------- Senhas (hash PBKDF2 com sal; nunca em texto puro) ---------- */
async function hashSenha(senha, sal) {
  if (window.crypto && crypto.subtle) {
    const enc = new TextEncoder();
    const chave = await crypto.subtle.importKey('raw', enc.encode(senha), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: enc.encode(sal), iterations: 100000, hash: 'SHA-256' }, chave, 256);
    return 'pbkdf2$' + [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2, '0')).join('');
  }
  // Alternativa apenas para navegadores sem Web Crypto (modo demonstração)
  let h1 = 0x811c9dc5, h2 = 0x1234567; const s = sal + ':' + senha;
  for (let r = 0; r < 3000; r++) for (let i = 0; i < s.length; i++) { h1 ^= s.charCodeAt(i) + r; h1 = Math.imul(h1, 16777619); h2 = Math.imul(h2 ^ h1, 2654435761); }
  return 'fnv$' + (h1 >>> 0).toString(16) + (h2 >>> 0).toString(16);
}

const Motor = {
  classificar(texto, manual) {
    const n = ' ' + normalizar(texto).replace(/[^\w\s]/g, ' ') + ' ';
    const hits = {};
    for (const [tema, kws] of Object.entries(TEMAS_KW)) {
      const h = kws.filter(k => n.includes(k)).length;
      if (h) hits[tema] = h;
    }
    let temas = Object.keys(hits).sort((a, b) => hits[b] - hits[a]);
    if (manual && !temas.includes(manual)) temas.unshift(manual);
    const sens = temas.filter(t => SENSIVEIS.includes(t));
    const maxSens = Math.max(0, ...sens.map(t => hits[t] || 0));
    let confianca = 'alta';
    if (!temas.length) confianca = 'baixa';
    else if (sens.length && maxSens === 1 && !manual) confianca = 'média';
    return { temas, confianca, manual: !!manual };
  },

  // Análise síncrona (usada também para criar os dados de demonstração)
  analisar(texto, manual, dataISO) {
    const cls = this.classificar(texto, manual);
    const n = normalizar(texto);
    const item = BASE_DEMO.find(b => b.p.some(rx => rx.test(n)));
    let temas = [...new Set([...(item ? item.temas.filter(t => t !== 'Geral') : []), ...cls.temas])];
    if (!temas.length) temas = ['Geral'];
    const sensiveis = temas.filter(t => SENSIVEIS.includes(t)); // política mais restritiva: todos os temas sensíveis valem
    const fontes = DB.data.fontes_confiaveis;
    const evidencias = [];
    if (item) {
      for (const [dom, posicao, trecho] of item.ev) {
        const f = fontes.find(x => x.dominio === dom);
        if (!f || !f.ativa) continue; // fonte removida ou desativada pelo administrador não é considerada
        evidencias.push({ fonte_nome: f.nome, dominio: f.dominio, url: urlDaFonte(f), tipo_fonte: f.tipo, peso: f.peso, posicao, trecho_relevante: trecho, data_consulta: dataISO });
      }
    }
    return { texto, temas, sensiveis, confianca: cls.confianca, ...calcularScore(evidencias, sensiveis), evidencias };
  },

  async verificar(texto, manual) {
    await sleep(1300 + Math.random() * 700); // simula a busca nas fontes
    if (DB.data.config.simularFalha) { const e = new Error('Serviço de fontes indisponível'); e.codigo = 'INDISPONIVEL'; throw e; }
    return this.analisar(texto, manual, agoraISO());
  }
};

/* ---------- Cálculo do score (determinístico) ---------- */
function calcularScore(evidencias, sensiveis) {
  let score = 50;
  const vistos = new Set();
  let oficiaisConf = 0, conf = 0, contra = 0;
  const grupos = {};
  for (const e of evidencias) {
    if (vistos.has(e.dominio)) { e.contabilizada = false; e.peso_aplicado = 0; continue; } // 1 contribuição por domínio
    vistos.add(e.dominio); e.contabilizada = true;
    let delta = 0;
    if (e.posicao === 'confirma') { delta = e.peso; conf++; if (e.tipo_fonte === 'oficial') oficiaisConf++; }
    else if (e.posicao === 'contradiz') { delta = -e.peso; contra++; }
    e.peso_aplicado = delta;
    score += delta;
    const k = e.tipo_fonte + '|' + e.posicao;
    grupos[k] = grupos[k] || { tipo: e.tipo_fonte, posicao: e.posicao, n: 0, soma: 0 };
    grupos[k].n++; grupos[k].soma += delta;
  }
  const scoreBruto = score;
  score = clamp(Math.round(score), 0, 100);
  const fatores = [{ texto: 'Ponto de partida (incerteza neutra)', valor: 50, tipo: 'base' }];
  const nomeTipo = { oficial: ['fonte oficial', 'fontes oficiais'], academica: ['fonte acadêmica', 'fontes acadêmicas'], imprensa: ['veículo de imprensa', 'veículos de imprensa'], outra: ['outra fonte', 'outras fontes'] };
  const verbo = { confirma: ['confirma', 'confirmam'], contradiz: ['contradiz', 'contradizem'], neutra: ['traz contexto neutro', 'trazem contexto neutro'] };
  for (const g of Object.values(grupos)) {
    const pl = g.n > 1 ? 1 : 0;
    fatores.push({ texto: `${g.n} ${nomeTipo[g.tipo][pl]} ${verbo[g.posicao][pl]}`, valor: g.soma, tipo: g.soma > 0 ? 'pos' : g.soma < 0 ? 'neg' : 'neu' });
  }
  if (scoreBruto !== score) fatores.push({ texto: `Limite aplicado (score bruto ${scoreBruto} ajustado para a faixa 0–100)`, valor: score - scoreBruto, tipo: 'neu' });

  const sensivel = sensiveis.length > 0;
  const requisitoOk = !sensivel || oficiaisConf >= 3;
  let bloqueado = false;
  if (sensivel && !requisitoOk && score >= 70) { bloqueado = true; fatores.push({ texto: 'Tema sensível sem 3 fontes oficiais: selo verde bloqueado', valor: 69 - score, tipo: 'neg' }); score = 69; }
  const cor = score >= 70 ? 'verde' : score >= 40 ? 'amarelo' : 'vermelho';
  const controversia = conf > 0 && contra > 0;
  const status = evidencias.length === 0 ? 'inconclusiva' : 'concluida';
  return { score, score_bruto: scoreBruto, cor, fatores, controversia, bloqueado, requisito_ok: requisitoOk, oficiais_confirmando: oficiaisConf, n_confirma: conf, n_contradiz: contra, status, resumo: gerarResumo({ score, cor, conf, contra, oficiaisConf, sensiveis, bloqueado, controversia, status, requisitoOk }) };
}

function gerarResumo(r) {
  const temas = r.sensiveis.join(' e ');
  if (r.status === 'inconclusiva') {
    let s = 'Não localizamos fontes sobre esta afirmação na base de demonstração. Ausência de evidência não significa que a informação seja falsa: ela apenas não pôde ser confirmada. Procure a fonte original antes de compartilhar.';
    if (r.sensiveis.length) s += ` Como o tema envolve ${temas}, recomendamos consultar diretamente os canais oficiais.`;
    return s;
  }
  let s = '';
  if (r.cor === 'verde') s = `As fontes localizadas concordam com a afirmação (${r.conf} confirmam${r.oficiaisConf ? `, sendo ${r.oficiaisConf} oficial${r.oficiaisConf > 1 ? 'is' : ''}` : ''}). O resultado indica boa sustentação nas evidências disponíveis, mas vale conferir o contexto na fonte original.`;
  else if (r.cor === 'vermelho') s = `As fontes localizadas contradizem a afirmação (${r.contra} contradiz${r.contra > 1 ? 'em' : ''}${r.conf ? ` e apenas ${r.conf} confirma${r.conf > 1 ? 'm' : ''}` : ''}). Pelas evidências disponíveis, ela provavelmente é falsa ou não tem base.`;
  else if (r.bloqueado) s = `Há evidências a favor da afirmação, mas o tema é sensível (${temas}) e encontramos apenas ${r.oficiaisConf} fonte${r.oficiaisConf === 1 ? '' : 's'} oficial${r.oficiaisConf === 1 ? '' : 'is'} confirmando, abaixo das 3 exigidas. Por isso o selo verde foi bloqueado e o resultado fica como duvidoso.`;
  else s = 'As evidências são parciais ou mistas. A afirmação pode ter algum fundamento, mas precisa de contexto antes de ser compartilhada como fato.';
  if (r.controversia) s += ' Atenção: as fontes discordam entre si.';
  return s;
}

/* ---------- Modal acessível ---------- */
function abrirModal(html, aoMontar) {
  const anterior = document.activeElement;
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-t">${html}</div>`;
  document.body.appendChild(bg);
  const caixa = $('.modal', bg);
  const fechar = () => { bg.remove(); document.removeEventListener('keydown', teclas); if (anterior && anterior.focus) anterior.focus(); };
  const teclas = e => {
    if (e.key === 'Escape') { e.preventDefault(); fechar(); bg.dispatchEvent(new Event('fechado')); }
    if (e.key === 'Tab') {
      const f = $$('button,a[href],input,select,textarea,[tabindex]:not([tabindex="-1"])', caixa).filter(x => !x.disabled);
      if (!f.length) return;
      if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    }
  };
  document.addEventListener('keydown', teclas);
  if (aoMontar) aoMontar(caixa, fechar, bg);
  const primeiro = $('[autofocus]', caixa) || $('input,select,textarea,button', caixa);
  if (primeiro) primeiro.focus();
  return fechar;
}
function confirmar(titulo, texto, rotuloOk = 'Confirmar', perigo = false) {
  return new Promise(res => {
    abrirModal(`<h2 id="modal-t">${titulo}</h2><p>${texto}</p><div class="actions"><button class="btn ${perigo ? 'btn-danger' : 'btn-primary'}" data-ok>${rotuloOk}</button><button class="btn btn-ghost" data-cancel autofocus>Cancelar</button></div>`,
      (cx, fechar, bg) => {
        $('[data-ok]', cx).onclick = () => { fechar(); res(true); };
        $('[data-cancel]', cx).onclick = () => { fechar(); res(false); };
        bg.addEventListener('fechado', () => res(false));
      });
  });
}

/* ---------- Formulários ---------- */
function campo({ id, label, type = 'text', auto = 'off', hint = '', attrs = '' }) {
  const desc = [hint ? id + '-hint' : '', id + '-err'].filter(Boolean).join(' ');
  return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" autocomplete="${auto}" aria-describedby="${desc}" ${attrs}>${hint ? `<div class="hint" id="${id}-hint">${hint}</div>` : ''}<div class="err" id="${id}-err"></div></div>`;
}
function setErro(id, msg) {
  const i = $('#' + id), e = $('#' + id + '-err');
  if (e) e.textContent = msg || '';
  if (i) i.setAttribute('aria-invalid', msg ? 'true' : 'false');
  return !msg;
}
function msgForm(el, tipo, texto) { el.innerHTML = texto ? `<div class="alert alert-${tipo}" role="alert"><span class="ic" aria-hidden="true">${tipo === 'danger' ? '⚠' : tipo === 'ok' ? '✓' : 'ℹ'}</span><p>${texto}</p></div>` : ''; }

      const email = normEmail($('#r-email').value), cod = $('#r-cod').value.trim().toUpperCase(), s1 = $('#r-senha').value, s2 = $('#r-senha2').value;
      let ok = setErro('r-email', !emailValido(email) ? 'Digite um e-mail válido.' : '');
      ok = setErro('r-cod', cod.length !== 6 ? 'O código tem 6 caracteres.' : '') && ok;
      ok = setErro('r-senha', !senhaForte(s1) ? 'A senha precisa ter 8 caracteres ou mais, com letras e números.' : '') && ok;
      ok = setErro('r-senha2', s1 !== s2 ? 'As senhas não são iguais.' : '') && ok;
      if (!ok) { $('[aria-invalid=true]').focus(); return; }
      const u = DB.data.usuarios.find(x => x.email === email);
      const r = u && DB.data.resets.find(x => x.usuario_id === u.id && x.codigo === cod && !x.usado);
      if (!r || r.expira < Date.now()) { msgForm($('#red-msg'), 'danger', 'Código inválido ou expirado. <a href="#/esqueci">Solicite um novo código</a>.'); return; }
      u.sal = uid('sal'); u.senha_hash = await hashSenha(s1, u.sal); u.data_atualizacao = agoraISO();
      r.usado = true; DB.auditar('Senha redefinida', 'Redefinição por código'); DB.salvar();
      toast('Senha alterada. Entre com a nova senha.', 'ok');
      ir('#/login');
    };
  } };
}

/* ----- Nova checagem ----- */
const EXEMPLOS = [
  'As urnas eletrônicas passam por testes públicos de segurança organizados pelo TSE.',
  'A vacina contra a gripe é oferecida gratuitamente pelo SUS para grupos prioritários.',
  'Investir em bitcoin é garantia de lucro.',
  'O Sol é uma estrela.',
  'Vitamina C previne gripe e resfriado.',
  'A taxa Selic é definida pelo Copom do Banco Central.',
];
let execucaoAtual = 0;

function vChecar() {
  return { titulo: 'Nova checagem', html: `
  <div class="page-head">
    <h1 tabindex="-1">Nova checagem</h1>
    <p class="lead">Cole uma afirmação ou a resposta de uma IA. A Ptolomy.AI procura fontes, classifica o tema e calcula um score de confiabilidade.</p>
  </div>
  <ol class="steps" id="etapas" aria-label="Etapas da checagem">
    <li data-s="1"><span class="n">1</span>Inserir texto</li>
    <li data-s="2"><span class="n">2</span>Revisar</li>
    <li data-s="3"><span class="n">3</span>Verificar</li>
    <li data-s="4"><span class="n">4</span>Interpretar</li>
  </ol>
  <div class="check-grid">
    <section class="card" aria-labelledby="form-t">
      <h2 id="form-t" class="sr-only">Texto para verificar</h2>
      <form id="f-check" novalidate>
        <label for="c-texto">Afirmação ou resposta de IA</label>
        <textarea id="c-texto" maxlength="2000" aria-describedby="c-hint c-err" placeholder="Ex.: As urnas eletrônicas passam por testes públicos de segurança."></textarea>
        <div class="row-between"><div class="hint" id="c-hint">Mínimo de 15 caracteres, máximo de 2.000.</div><div class="hint" id="c-cont">0 / 2000</div></div>
        <div class="err" id="c-err"></div>
        <div class="field" style="margin-top:14px">
          <label for="c-tema">Tema sensível (opcional)</label>
          <select id="c-tema" aria-describedby="c-tema-hint"><option value="">Detectar automaticamente</option><option>Saúde</option><option>Finanças</option><option>Eleições</option></select>
          <div class="hint" id="c-tema-hint">Indicar um tema só deixa a regra mais rigorosa; nunca remove o que foi detectado automaticamente.</div>
        </div>
        <div id="revisao" class="revisao" hidden>
          <h3>Revise antes de enviar</h3>
          <blockquote class="texto" id="rev-texto"></blockquote>
          <p class="hint" id="rev-tema"></p>
          <div class="actions">
            <button type="button" class="btn btn-primary" id="btn-confirmar">Confirmar e verificar</button>
            <button type="button" class="btn btn-ghost" id="btn-editar">Editar texto</button>
          </div>
        </div>
        <div class="actions" id="acoes-ini"><button type="submit" class="btn btn-primary" id="btn-verificar">Verificar</button></div>
      </form>
      <div style="margin-top:18px">
        <p class="hint" style="margin-bottom:8px">Exemplos para testar:</p>
        <div class="chips">${EXEMPLOS.map(t => `<button type="button" class="chip" data-ex="${esc(t)}">${esc(trunc(t, 52))}</button>`).join('')}</div>
      </div>
    </section>
    <aside class="card how" aria-labelledby="how-t">
      <div style="display:flex;gap:12px;align-items:center;margin-bottom:10px">${mascote(44)}<h2 id="how-t" style="margin:0">Como funciona</h2></div>
      <ol>
        <li>Classificamos o tema e identificamos se é sensível (Saúde, Finanças ou Eleições).</li>
        <li>Buscamos evidências em fontes oficiais, acadêmicas e de imprensa.</li>
        <li>Calculamos o score a partir do tipo das fontes e da concordância entre elas.</li>
        <li>Em temas sensíveis, o selo verde exige pelo menos 3 fontes oficiais.</li>
      </ol>
      <p class="nota" style="margin-bottom:0">O resultado fica salvo automaticamente no seu histórico.</p>
    </aside>
  </div>
  <section id="saida" aria-label="Resultado da checagem"></section>`,
  montar(m) {
    const ta = $('#c-texto', m), cont = $('#c-cont', m), rev = $('#revisao', m), ini = $('#acoes-ini', m);
    const etapa = n => $$('#etapas li', m).forEach(li => { const s = +li.dataset.s; li.classList.toggle('on', s <= n); if (s === n) li.setAttribute('aria-current', 'step'); else li.removeAttribute('aria-current'); });
    etapa(1);
    const atualizarCont = () => { cont.textContent = `${ta.value.length} / 2000`; };
    ta.addEventListener('input', () => { atualizarCont(); setErro('c-texto', ''); if (!rev.hidden) { rev.hidden = true; ini.hidden = false; etapa(1); } });
    $$('[data-ex]', m).forEach(b => b.onclick = () => { ta.value = b.dataset.ex; atualizarCont(); setErro('c-texto', ''); rev.hidden = true; ini.hidden = false; etapa(1); ta.focus(); });

    $('#f-check', m).onsubmit = e => {
      e.preventDefault();
      const t = ta.value.trim();
      if (!setErro('c-texto', !t ? 'Digite ou cole um texto para verificar.' : t.length < 15 ? `Texto muito curto (${t.length} caracteres). Use pelo menos 15 para termos contexto.` : '')) { ta.focus(); return; }
      $('#rev-texto').textContent = t;
      const manual = $('#c-tema').value;
      const cls = Motor.classificar(t, manual);
      $('#rev-tema').textContent = 'Tema identificado: ' + (cls.temas.length ? cls.temas.join(', ') : 'Geral') + (cls.temas.some(x => SENSIVEIS.includes(x)) ? ' — tema sensível: regras mais rígidas serão aplicadas.' : '.');
      rev.hidden = false; ini.hidden = true; etapa(2);
      $('#btn-confirmar').focus();
    };
    $('#btn-editar', m).onclick = () => { rev.hidden = true; ini.hidden = false; etapa(1); ta.focus(); };
    $('#btn-confirmar', m).onclick = () => executar();

    async function executar(forcar = false) {
      const u = usuarioAtual(); if (!u) { ir('#/login'); return; }
      const texto = ta.value.trim(), manual = $('#c-tema').value;
      const saida = $('#saida');
      const nt = normalizar(texto).replace(/\s+/g, ' ');
      const minhas = DB.data.checagens.filter(c => c.usuario_id === u.id);
      // Tentativa duplicada
      const dup = minhas.find(c => normalizar(c.texto).replace(/\s+/g, ' ') === nt && Date.now() - new Date(c.data) < 10 * 60000);
      if (dup && !forcar) {
        saida.innerHTML = `<div class="alert alert-info" role="alert"><span class="ic" aria-hidden="true">ℹ</span><div><strong>Você verificou este mesmo texto há poucos minutos.</strong><p>Para evitar duplicidade, abra o resultado anterior ou verifique novamente.</p><div class="actions"><a class="btn btn-primary btn-sm" href="#/checagem/${encodeURIComponent(dup.id)}">Abrir resultado anterior</a><button class="btn btn-ghost btn-sm" id="btn-forcar">Verificar novamente</button></div></div></div>`;
        $('#btn-forcar').onclick = () => executar(true);
        return;
      }
      // Limite de uso
      if (minhas.filter(c => Date.now() - new Date(c.data) < 60000).length >= 8) {
        saida.innerHTML = `<div class="alert alert-warn" role="alert"><span class="ic" aria-hidden="true">⏳</span><div><strong>Limite temporário atingido.</strong><p>Você fez muitas checagens no último minuto. Aguarde alguns instantes e tente de novo.</p></div></div>`;
        return;
      }
      const minhaExec = ++execucaoAtual;
      $('#btn-confirmar').disabled = true; $('#btn-editar').disabled = true; $('#btn-confirmar').textContent = 'Verificando…';
      etapa(3);
      saida.innerHTML = esqueleto();
      anunciar('Verificando a afirmação. Aguarde.');
      try {
        const r = await Motor.verificar(texto, manual);
        if (minhaExec !== execucaoAtual) return; // ignora resposta antiga
        const c = salvarChecagem(u.id, r, agoraISO());
        DB.salvar();
        etapa(4);
        saida.innerHTML = htmlResultado(c, DB.data.evidencias.filter(e => e.checagem_id === c.id), true);
        ligarResultado(saida, () => { ta.value = ''; atualizarCont(); rev.hidden = true; ini.hidden = false; etapa(1); saida.innerHTML = ''; ta.focus(); window.scrollTo({ top: 0 }); });
        anunciar(`Verificação concluída. Score ${c.score} de 100: ${ROTULO[c.cor]}.`);
        $('#res-t').focus();
      } catch (err) {
        if (minhaExec !== execucaoAtual) return;
        etapa(3);
        const indisp = err.codigo === 'INDISPONIVEL';
        saida.innerHTML = `<div class="alert alert-danger" role="alert"><span class="ic" aria-hidden="true">⚠</span><div><strong>${indisp ? 'O serviço de fontes está indisponível no momento.' : 'Não foi possível concluir a verificação.'}</strong><p>Nenhum resultado foi gerado, para não mostrar uma conclusão sem evidências. Seu texto continua no campo acima.</p><div class="actions"><button class="btn btn-primary btn-sm" id="btn-retentar">Tentar novamente</button></div></div></div>`;
        $('#btn-retentar').onclick = () => executar(true);
        anunciar('A verificação falhou. Você pode tentar novamente.');
      } finally {
        const b = $('#btn-confirmar'); if (b) { b.disabled = false; b.textContent = 'Confirmar e verificar'; }
        const ed = $('#btn-editar'); if (ed) ed.disabled = false;
      }
    }
  } };
}

function esqueleto() {
  return `<div class="result" aria-busy="true"><div class="card"><div class="skeleton" style="height:120px;width:220px;max-width:100%;margin:0 auto"></div><div class="skeleton sk-line" style="width:60%;margin:16px auto"></div><div class="skeleton sk-line"></div><div class="skeleton sk-line" style="width:80%"></div></div>
  <div class="card"><p class="muted" style="margin-bottom:6px">Buscando evidências em fontes oficiais, acadêmicas e de imprensa…</p>${'<div class="skeleton" style="height:84px;margin-top:12px"></div>'.repeat(3)}</div></div>`;
}

/* ----- Resultado (usado na checagem e no detalhe do histórico) ----- */
function htmlResultado(c, evs, novo) {
  const avisosDominio = {
    'Saúde': 'Este resultado não é orientação médica. Consulte profissionais de saúde e os canais oficiais do Ministério da Saúde.',
    'Finanças': 'Este resultado não é recomendação de investimento. Consulte o Banco Central, a CVM e profissionais habilitados.',
    'Eleições': 'Para informações eleitorais, consulte sempre o TSE e o TRE do seu estado.',
  };
  const fatores = c.fatores.map(f => `<li><span>${esc(f.texto)}</span><span class="v ${f.tipo === 'base' ? 'neu' : f.tipo}">${f.tipo === 'base' ? f.valor : (f.valor > 0 ? '+' : f.valor < 0 ? '−' : '±') + Math.abs(f.valor)}</span></li>`).join('')
    + (c.tema_sensivel ? `<li><span>Tema sensível (${esc(c.sensiveis.join(', '))}): requisito de 3 fontes oficiais</span><span class="v ${c.requisito_ok ? 'pos' : 'neg'}">${c.requisito_ok ? 'atendido' : `não atendido (${c.oficiais_confirmando}/3)`}</span></li>` : '')
    + `<li><strong>Score final</strong><span class="v"><strong>${c.score}</strong></span></li>`;
  const evHtml = evs.length ? `<ul class="ev-list">${evs.map(e => {
    const url = e.url ? urlSegura(e.url) : null;
    const [ic, pos] = POSICAO[e.posicao];
    return `<li class="ev ${e.posicao}">
      <div class="ev-top"><strong>${esc(e.fonte_nome)}</strong><span class="badge ${e.tipo_fonte}">${TIPOS_FONTE[e.tipo_fonte]}</span></div>
      ${url ? `<a class="dom" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(e.dominio)} <span aria-hidden="true">↗</span><span class="sr-only"> (abre em nova aba)</span></a>` : `<span class="hint">${esc(e.dominio)} — link indisponível (fonte fictícia de demonstração)</span>`}
      <p>${esc(e.trecho_relevante)}</p>
      <div class="ev-meta"><span class="pos-tag ${e.posicao}"><span aria-hidden="true">${ic}</span>${pos}</span><span>Consultada em ${fmtData(e.data_consulta)}</span><span>${e.contabilizada ? `Impacto: ${e.peso_aplicado > 0 ? '+' : e.peso_aplicado < 0 ? '−' : ''}${Math.abs(e.peso_aplicado)}` : 'Não contabilizada (domínio repetido)'}</span></div>
    </li>`; }).join('')}</ul>`
    : `<div class="empty" style="padding:20px"><p>Nenhuma fonte foi localizada para esta afirmação na base de demonstração.</p></div>`;

  return `
  <div class="row-between" style="margin-bottom:12px">
    <div><h2 id="res-t" tabindex="-1">Resultado da checagem</h2><p class="hint" style="margin:0">Gerado em ${fmtDataHora(c.data)} · Modo demonstração${novo ? ' · Salvo automaticamente no histórico' : ''}</p></div>
  </div>
  <div class="result">
    <div class="stack">
      <div class="card score-card cor-${c.cor}">
        ${medidor(c.score, c.cor)}
        <p class="score-label ${c.cor}"><span class="ic-circle ic-${c.cor}" aria-hidden="true">${ICONE[c.cor]}</span><span><span class="sr-only">Score ${c.score} de 100: </span>${c.status === 'inconclusiva' ? 'Inconclusivo — ' : ''}${ROTULO[c.cor]}</span></p>
        <div style="display:flex;justify-content:center">${badgesTema(c.temas)}</div>
        <p class="hint" style="margin-top:8px">Classificação do tema: confiança ${c.classificacao_confianca}${c.classificacao_confianca !== 'alta' ? '. Se a afirmação tratar de Saúde, Finanças ou Eleições, indique o tema manualmente e verifique de novo.' : '.'}</p>
      </div>
      <div class="card"><h3>Texto verificado</h3><blockquote class="texto">${esc(c.texto)}</blockquote></div>
      ${c.tema_sensivel && !c.requisito_ok ? `<div class="alert alert-warn" role="note"><span class="ic" aria-hidden="true">⚑</span><div><strong>Tema sensível: não encontramos fontes oficiais suficientes para confirmar esta informação.</strong><p>${c.bloqueado ? 'O selo verde foi bloqueado pela regra de temas sensíveis.' : `Foram encontradas ${c.oficiais_confirmando} de 3 fontes oficiais confirmando.`}</p></div></div>` : ''}
      ${c.controversia ? `<div class="alert alert-danger" role="note"><span class="ic" aria-hidden="true">⚠</span><div><strong>Alerta de controvérsia</strong><p>As fontes discordam entre si: algumas confirmam e outras contradizem a afirmação. Leia as evidências antes de tirar conclusões.</p></div></div>` : ''}
      <div class="card">
        <h3>Resumo</h3>
        <p>${esc(c.resumo)}</p>
        <h3 style="margin-top:18px">Como chegamos a este score</h3>
        <ul class="fatores">${fatores}</ul>
        <p class="nota">O score é uma estimativa baseada nas fontes localizadas, no tipo das fontes e na concordância entre elas. Ele não substitui avaliação profissional ou consulta à fonte original.${c.sensiveis.map(t => ' ' + avisosDominio[t]).join('')}</p>
      </div>
    </div>
    <div class="card">
      <h3>Evidências <span class="muted" style="font-family:var(--font);font-weight:500">(${evs.length})</span></h3>
      <p class="hint" style="margin-top:-4px;margin-bottom:12px">Modo demonstração: os links levam à página inicial de cada fonte; os trechos são resumos da base local.</p>
      ${evHtml}
    </div>
  </div>
  <div class="actions"><button class="btn btn-gold" data-nova>Nova checagem</button><a class="btn btn-ghost" href="#/historico">Ver histórico</a></div>`;
}
function ligarResultado(el, aoNova) { const b = $('[data-nova]', el); if (b) b.onclick = aoNova || (() => ir('#/checar')); }

/* ----- Histórico ----- */
const filtroHist = { busca: '', cor: '', tema: '', pagina: 1 };
const POR_PAGINA = 8;
function vHistorico() {
  const u = usuarioAtual();
  const minhas = DB.data.checagens.filter(c => c.usuario_id === u.id).sort((a, b) => b.data.localeCompare(a.data));
  const temas = [...new Set(minhas.flatMap(c => c.temas))].sort((a, b) => a.localeCompare(b, 'pt-BR'));
  const cab = `<div class="page-head"><h1 tabindex="-1">Histórico</h1><p class="lead">Todas as suas checagens, da mais recente para a mais antiga. Abra uma para ver o resultado completo.</p></div>`;
  if (!minhas.length) return { titulo: 'Histórico', html: cab + vazio('Você ainda não fez nenhuma checagem', 'Quando verificar uma afirmação, ela aparecerá aqui com o score e o tema.', '<a class="btn btn-primary" href="#/checar">Fazer a primeira checagem</a>') };
  const aberto = window.matchMedia('(min-width: 768px)').matches;
  return { titulo: 'Histórico', html: cab + `
  <details class="card filtros" ${aberto ? 'open' : ''}>
    <summary>Busca e filtros</summary>
    <form id="f-filtros" class="filtros-grid" role="search" onsubmit="return false">
      <div class="field"><label for="h-busca">Buscar por palavra</label><input id="h-busca" type="search" placeholder="Ex.: vacina, urna, poupança"></div>
      <div class="field"><label for="h-cor">Resultado</label><select id="h-cor"><option value="">Todos</option><option value="verde">Confiável</option><option value="amarelo">Duvidoso</option><option value="vermelho">Provavelmente falso</option></select></div>
      <div class="field"><label for="h-tema">Tema</label><select id="h-tema"><option value="">Todos</option>${temas.map(t => `<option>${esc(t)}</option>`).join('')}</select></div>
      <div class="field"><button type="button" class="btn btn-ghost w100" id="h-limpar">Limpar filtros</button></div>
    </form>
  </details>
  <p id="h-cont" class="hint" aria-live="polite" style="margin-top:14px"></p>
  <ul id="h-lista" class="hist-list"></ul>
  <nav id="h-pag" class="pag" aria-label="Paginação do histórico"></nav>`,
  montar(m) {
    const bus = $('#h-busca', m), cor = $('#h-cor', m), tem = $('#h-tema', m);
    bus.value = filtroHist.busca; cor.value = filtroHist.cor; tem.value = temas.includes(filtroHist.tema) ? filtroHist.tema : '';
    const atualizar = () => {
      filtroHist.busca = bus.value; filtroHist.cor = cor.value; filtroHist.tema = tem.value;
      const q = normalizar(bus.value.trim());
      const lista = minhas.filter(c => (!q || normalizar(c.texto).includes(q)) && (!cor.value || c.cor === cor.value) && (!tem.value || c.temas.includes(tem.value)));
      const paginas = Math.max(1, Math.ceil(lista.length / POR_PAGINA));
      filtroHist.pagina = clamp(filtroHist.pagina, 1, paginas);
      const pag = lista.slice((filtroHist.pagina - 1) * POR_PAGINA, filtroHist.pagina * POR_PAGINA);
      const filtrando = q || cor.value || tem.value;
      $('#h-cont').textContent = filtrando ? `${lista.length} de ${minhas.length} checagens correspondem aos filtros.` : `${minhas.length} checagens no total.`;
      $('#h-lista').innerHTML = pag.length ? pag.map(c => `<li><a class="hist-item" href="#/checagem/${encodeURIComponent(c.id)}">${pill(c)}<span class="hi-txt"><span class="hi-trecho">${esc(trunc(c.texto, 150))}</span><span class="hi-meta">${fmtDataHora(c.data)} · ${esc(c.temas.join(', '))}${c.status === 'inconclusiva' ? ' · Inconclusiva' : ''}${c.controversia ? ' · Fontes divergentes' : ''}</span></span><span class="hi-go" aria-hidden="true">›</span></a></li>`).join('')
        : `<li class="card empty" style="padding:24px"><p>Nenhuma checagem encontrada com esses filtros.</p><button class="btn btn-ghost btn-sm" id="h-limpar2">Limpar filtros</button></li>`;
      const l2 = $('#h-limpar2'); if (l2) l2.onclick = limpar;
      $('#h-pag').innerHTML = paginas > 1 ? `<button class="btn btn-ghost btn-sm" data-p="-1" ${filtroHist.pagina === 1 ? 'disabled' : ''}>‹ Anterior</button><span class="small">Página ${filtroHist.pagina} de ${paginas}</span><button class="btn btn-ghost btn-sm" data-p="1" ${filtroHist.pagina === paginas ? 'disabled' : ''}>Próxima ›</button>` : '';
      $$('[data-p]', m).forEach(b => b.onclick = () => { filtroHist.pagina += +b.dataset.p; atualizar(); $('#h-cont').focus && window.scrollTo({ top: 0 }); });
    };
    const limpar = () => { bus.value = ''; cor.value = ''; tem.value = ''; filtroHist.pagina = 1; atualizar(); bus.focus(); };
    bus.addEventListener('input', () => { filtroHist.pagina = 1; atualizar(); });
    [cor, tem].forEach(s => s.addEventListener('change', () => { filtroHist.pagina = 1; atualizar(); }));
    $('#h-limpar', m).onclick = limpar;
    atualizar();
  } };
}

/* ----- Detalhe de uma checagem ----- */
function vDetalhe(id) {
  const u = usuarioAtual();
  const c = DB.data.checagens.find(x => x.id === id);
  if (!c) return vMensagem('Checagem não encontrada', 'Ela pode ter sido removida ou o endereço está incorreto.', '<a class="btn btn-primary" href="#/historico">Voltar ao histórico</a>');
  if (c.usuario_id !== u.id) { // isolamento por usuário: nem o admin vê textos de outros usuários
    DB.auditar('Acesso negado', 'Tentativa de abrir checagem de outro usuário'); DB.salvar();
    return vMensagem('Acesso negado', 'Você não tem permissão para ver esta checagem. Cada usuário acessa apenas as próprias checagens.', '<a class="btn btn-primary" href="#/historico">Ir para o meu histórico</a>', '🔒');
  }
  const evs = DB.data.evidencias.filter(e => e.checagem_id === c.id);

/* ----- Painel de dados ----- */
let escopoPainel = 'meu';
function vPainel() {
  const u = usuarioAtual();
  const admin = u.tipo === 'admin';
  if (!admin) escopoPainel = 'meu';
  const lista = escopoPainel === 'plataforma' ? DB.data.checagens : DB.data.checagens.filter(c => c.usuario_id === u.id);
  const total = lista.length;
  const cont = { verde: 0, amarelo: 0, vermelho: 0 };
  lista.forEach(c => cont[c.cor]++);
  const porTema = {};
  lista.forEach(c => c.temas.forEach(t => porTema[t] = (porTema[t] || 0) + 1));
  const temas = Object.entries(porTema).sort((a, b) => b[1] - a[1]);
  const dias = [];
  for (let i = 29; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); dias.push({ k: chaveDia(d), rot: d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }), n: 0 }); }
  lista.forEach(c => { const k = chaveDia(new Date(c.data)); const d = dias.find(x => x.k === k); if (d) d.n++; });
  const sens = lista.filter(c => c.tema_sensivel).length;

  const seletor = admin ? `<div class="seg" role="group" aria-label="Escopo dos dados"><button data-esc="meu" aria-pressed="${escopoPainel === 'meu'}">Meus dados</button><button data-esc="plataforma" aria-pressed="${escopoPainel === 'plataforma'}">Plataforma (agregado)</button></div>` : '';
  const cab = `<div class="page-head"><h1 tabindex="-1">Painel de dados</h1><p class="lead">${escopoPainel === 'plataforma' ? 'Métricas agregadas de toda a plataforma. Nenhum texto de checagem de outros usuários é exibido.' : 'Indicadores calculados apenas sobre as suas checagens.'}</p></div>${seletor}`;
  const montarSeletor = m => $$('[data-esc]', m).forEach(b => b.onclick = () => { escopoPainel = b.dataset.esc; render(); });

  if (!total) return { titulo: 'Painel', html: cab + vazio('Ainda não há dados para mostrar', 'Faça sua primeira checagem e o painel passa a exibir a distribuição dos scores, os temas e a evolução no tempo.', '<a class="btn btn-primary" href="#/checar">Fazer uma checagem</a>'), montar: montarSeletor };

  const kpis = `<div class="kpis">
    <div class="card kpi"><div class="n">${total}</div><div class="l">${escopoPainel === 'plataforma' ? 'checagens na plataforma' : 'checagens feitas'}</div></div>
    <div class="card kpi"><div class="n" style="color:var(--t-verde)">${pct(cont.verde, total)}%</div><div class="l"><span aria-hidden="true">✓</span> confiáveis (${cont.verde})</div></div>
    <div class="card kpi"><div class="n" style="color:var(--t-amarelo)">${pct(cont.amarelo, total)}%</div><div class="l"><span aria-hidden="true">!</span> duvidosas (${cont.amarelo})</div></div>
    <div class="card kpi"><div class="n" style="color:var(--t-vermelho)">${pct(cont.vermelho, total)}%</div><div class="l"><span aria-hidden="true">✕</span> provavelmente falsas (${cont.vermelho})</div></div>
  </div>
  ${escopoPainel === 'plataforma' ? `<p class="hint" style="margin-top:-6px;margin-bottom:16px">${DB.data.usuarios.length} usuários cadastrados · ${sens} checagens em temas sensíveis · ${DB.data.checagens.filter(c => c.controversia).length} com fontes divergentes</p>` : `<p class="hint" style="margin-top:-6px;margin-bottom:16px">${sens} das suas checagens envolveram temas sensíveis.</p>`}`;

  return { titulo: 'Painel', html: cab + kpis + `<div class="charts">
    <figure class="card">${graficoRosca(cont, total)}</figure>
    <figure class="card">${graficoBarras(temas)}</figure>
    <figure class="card wide">${graficoLinha(dias)}</figure>
  </div>`, montar: montarSeletor };
}

function graficoRosca(cont, total) {
  let acum = 0;
  const segs = ['verde', 'amarelo', 'vermelho'].map(k => {
    const p = cont[k] / total * 100; if (!p) return '';
    const s = `<circle r="15.9155" cx="21" cy="21" fill="none" stroke="var(--c-${k})" stroke-width="6" stroke-dasharray="${p.toFixed(2)} ${(100 - p).toFixed(2)}" stroke-dashoffset="${(25 - acum).toFixed(2)}"/>`;
    acum += p; return s;
  }).join('');
  const desc = `Distribuição: ${cont.verde} confiáveis (${pct(cont.verde, total)}%), ${cont.amarelo} duvidosas (${pct(cont.amarelo, total)}%), ${cont.vermelho} provavelmente falsas (${pct(cont.vermelho, total)}%).`;
  return `<figcaption>Distribuição dos resultados</figcaption><div class="chart-sub">Todas as checagens do período · em quantidade e %</div>
  <div class="donut-wrap">
    <svg class="donut" viewBox="0 0 42 42" role="img" aria-label="${desc}"><circle r="15.9155" cx="21" cy="21" fill="none" stroke="#ece8dc" stroke-width="6"/>${segs}<text x="21" y="22.5" text-anchor="middle" font-size="7" font-weight="700" fill="#0f1f3d" font-family="Fraunces, Georgia, serif">${total}</text><text x="21" y="27.5" text-anchor="middle" font-size="2.6" fill="#545e73">checagens</text></svg>
    <ul class="legend">${['verde', 'amarelo', 'vermelho'].map(k => `<li><span class="sw" style="background:var(--c-${k})" aria-hidden="true"></span><span aria-hidden="true">${ICONE[k]}</span> ${ROTULO_CURTO[k]}: <strong>${cont[k]}</strong> (${pct(cont[k], total)}%)</li>`).join('')}</ul>
  </div>`;
}
function graficoBarras(temas) {
  const max = Math.max(1, ...temas.map(t => t[1]));
  return `<figcaption>Temas mais checados</figcaption><div class="chart-sub">Quantidade de checagens por tema (uma checagem pode ter mais de um tema)</div>
  <div class="bars" role="list">${temas.map(([t, n]) => `<div class="bar-row" role="listitem"><span>${esc(t)}${SENSIVEIS.includes(t) ? ' <span aria-hidden="true">⚑</span>' : ''}</span><span class="bar-track" aria-hidden="true"><span class="bar-fill" style="width:${(n / max * 100).toFixed(1)}%"></span></span><span class="bar-val">${n}</span></div>`).join('')}</div>
  <p class="hint" style="margin-top:10px"><span aria-hidden="true">⚑</span> tema sensível</p>`;
}
function graficoLinha(dias) {
  const W = 640, H = 220, PL = 34, PR = 14, PT = 14, PB = 32;
  const max = Math.max(1, ...dias.map(d => d.n));
  const x = i => PL + i * (W - PL - PR) / (dias.length - 1);
  const y = v => PT + (H - PT - PB) * (1 - v / max);
  const pts = dias.map((d, i) => `${x(i).toFixed(1)},${y(d.n).toFixed(1)}`).join(' ');
  const totalP = dias.reduce((s, d) => s + d.n, 0);
  const pico = dias.reduce((a, d) => (d.n > a.n ? d : a), dias[0]);
  const marcasY = [...new Set([0, Math.ceil(max / 2), max])];
  const desc = `Nos últimos 30 dias foram ${totalP} checagens. ${pico.n ? `Maior volume em ${pico.rot}, com ${pico.n}.` : ''}`;
  return `<figcaption>Checagens por dia — últimos 30 dias</figcaption><div class="chart-sub">Eixo horizontal: dias · eixo vertical: número de checagens</div>
  <svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${desc}">
    ${marcasY.map(v => `<line x1="${PL}" x2="${W - PR}" y1="${y(v)}" y2="${y(v)}" stroke="#ece8dc"/><text x="${PL - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#545e73">${v}</text>`).join('')}
    <polyline points="${PL},${y(0)} ${pts} ${W - PR},${y(0)}" fill="rgba(201,162,39,.15)" stroke="none"/>
    <polyline points="${pts}" fill="none" stroke="#1b2f57" stroke-width="2.5" stroke-linejoin="round"/>
    ${dias.map((d, i) => d.n ? `<circle cx="${x(i)}" cy="${y(d.n)}" r="4" fill="#c9a227" stroke="#0f1f3d" stroke-width="1.5"/>` : '').join('')}
    ${[0, 10, 20, 29].map(i => `<text x="${x(i)}" y="${H - 10}" text-anchor="middle" font-size="11" fill="#545e73">${dias[i].rot}</text>`).join('')}
  </svg>
  <p class="hint">${desc}</p>
  <details class="dados"><summary>Ver dados em tabela</summary><div class="table-wrap"><table><thead><tr><th scope="col">Dia</th><th scope="col">Checagens</th></tr></thead><tbody>${dias.filter(d => d.n).map(d => `<tr><td>${d.rot}</td><td>${d.n}</td></tr>`).join('') || '<tr><td colspan="2">Sem checagens no período.</td></tr>'}</tbody></table></div></details>`;
}

function adminFontes(p) {
  const fs = [...DB.data.fontes_confiaveis].sort((a, b) => a.tipo.localeCompare(b.tipo) || a.nome.localeCompare(b.nome, 'pt-BR'));
  p.innerHTML = `<div class="row-between" style="margin-bottom:12px"><p class="muted" style="margin:0">${fs.filter(f => f.ativa).length} ativas de ${fs.length} fontes. Fontes desativadas não entram em novas checagens.</p><button class="btn btn-primary" id="btn-nova-fonte">+ Nova fonte</button></div>

    <td class="acoes"><div class="chips"><button class="btn btn-ghost btn-sm" data-ed="${f.id}">Editar<span class="sr-only"> ${esc(f.nome)}</span></button><button class="btn btn-ghost btn-sm" data-tg="${f.id}">${f.ativa ? 'Desativar' : 'Ativar'}<span class="sr-only"> ${esc(f.nome)}</span></button><button class="btn btn-ghost btn-sm" data-rm="${f.id}">Excluir<span class="sr-only"> ${esc(f.nome)}</span></button></div></td>
  </tr>`).join('')}</tbody></table></div></div>`;
  $('#btn-nova-fonte', p).onclick = () => formFonte(null);
  $$('[data-ed]', p).forEach(b => b.onclick = () => formFonte(DB.data.fontes_confiaveis.find(f => f.id === b.dataset.ed)));
  $$('[data-tg]', p).forEach(b => b.onclick = () => {

  $$('[data-rm]', p).forEach(b => b.onclick = async () => {

    DB.auditar('Fonte excluída', f.nome); DB.salvar(); toast('Fonte excluída.', 'ok'); render();
  });

function formFonte(f) {
  const novo = !f;
  abrirModal(`<h2 id="modal-t">${novo ? 'Nova fonte confiável' : 'Editar fonte'}</h2>
  <form id="f-fonte" novalidate>
    ${campo({ id: 'ff-nome', label: 'Nome', attrs: `value="${esc(f ? f.nome : '')}" autofocus` })}
    ${campo({ id: 'ff-dom', label: 'Domínio', hint: 'Sem https://. Ex.: gov.br/saude ou ibge.gov.br', attrs: `value="${esc(f ? f.dominio : '')}"` })}
    <div class="field"><label for="ff-tipo">Tipo</label><select id="ff-tipo">${Object.entries(TIPOS_FONTE).map(([k, v]) => `<option value="${k}" ${f && f.tipo === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
    ${campo({ id: 'ff-peso', label: 'Peso no score', type: 'number', hint: 'Número inteiro de 0 a 50. Padrão: oficial 30, acadêmica 20, imprensa 15.', attrs: `min="0" max="50" step="1" value="${f ? f.peso : 30}"` })}
    <div class="field"><label for="ff-obs">Observação interna (opcional)</label><textarea id="ff-obs" maxlength="300" style="min-height:80px">${esc(f ? f.observacao : '')}</textarea></div>
    <div class="check-row field"><input type="checkbox" id="ff-ativa" ${!f || f.ativa ? 'checked' : ''}><label for="ff-ativa">Fonte ativa</label></div>
    <div class="actions"><button class="btn btn-primary" type="submit">Salvar</button><button class="btn btn-ghost" type="button" data-cancel>Cancelar</button></div>
  </form>`, (cx, fechar) => {
    const tipo = $('#ff-tipo', cx);
    if (novo) tipo.onchange = () => { $('#ff-peso', cx).value = PESO_PADRAO[tipo.value]; };
    $('[data-cancel]', cx).onclick = fechar;
    $('#f-fonte', cx).onsubmit = e => {
      e.preventDefault();
      const nome = $('#ff-nome', cx).value.trim(), dom = $('#ff-dom', cx).value.trim().toLowerCase().replace(/^https?:\/\//, '').replace(/^www\./, '').replace(/\/+$/, '');
      const pesoTxt = $('#ff-peso', cx).value, peso = Number(pesoTxt);
      let ok = setErro('ff-nome', nome.length < 2 ? 'Informe o nome da fonte.' : nome.length > 80 ? 'Use no máximo 80 caracteres.' : '');
      ok = setErro('ff-dom', !/^[a-z0-9-]+(\.[a-z0-9-]+)+(\/[a-z0-9._-]+)*$/.test(dom) ? 'Domínio inválido. Use algo como ibge.gov.br ou gov.br/saude.' : DB.data.fontes_confiaveis.some(x => x.dominio === dom && (!f || x.id !== f.id)) ? 'Já existe uma fonte com este domínio.' : '') && ok;
      ok = setErro('ff-peso', pesoTxt === '' || !Number.isInteger(peso) || peso < 0 || peso > 50 ? 'O peso deve ser um número inteiro entre 0 e 50.' : '') && ok;
      if (!ok) { $('[aria-invalid=true]', cx).focus(); return; }
      const dados = { nome, dominio: dom, tipo: tipo.value, peso, observacao: $('#ff-obs', cx).value.trim(), ativa: $('#ff-ativa', cx).checked, data_atualizacao: agoraISO() };
      if (novo) { DB.data.fontes_confiaveis.push({ id: uid('fnt'), ficticia: false, ...dados }); DB.auditar('Fonte criada', `${nome} (${TIPOS_FONTE[dados.tipo]}, peso ${peso})`); }
      else { const mud = f.peso !== peso ? ` · peso ${f.peso} → ${peso}` : ''; Object.assign(f, dados); DB.auditar('Fonte editada', nome + mud); }
      DB.salvar(); fechar(); toast('Fonte salva.', 'ok'); render();
    };
  });
}

  <div class="card" style="padding:8px 14px"><div class="table-wrap"><table class="resp"><thead><tr><th scope="col">Data</th><th scope="col">Responsável</th><th scope="col">Ação</th><th scope="col">Detalhe</th></tr></thead><tbody>
  ${ev.map(a => `<tr><td data-label="Data">${fmtDataHora(a.data)}</td><td data-label="Responsável">${esc(a.usuario)}</td><td data-label="Ação">${esc(a.acao)}</td><td data-label="Detalhe">${esc(a.detalhe || '')}</td></tr>`).join('') || '<tr><td colspan="4">Nenhum evento registrado.</td></tr>'}
  </tbody></table></div></div>`;
}

function adminConfig(p) {
  p.innerHTML = `<div class="two">
    <section class="card"><h2>Simular falha externa</h2><p class="muted">Faz o serviço de fontes ficar indisponível, para demonstrar o tratamento de erro na apresentação.</p>
      <div class="check-row"><input type="checkbox" id="cfg-falha" ${DB.data.config.simularFalha ? 'checked' : ''}><label for="cfg-falha">Fonte externa indisponível</label></div></section>
    <section class="card"><h2>Restaurar demonstração</h2><p class="muted">Apaga todos os dados deste navegador e recria as contas e as 15 checagens de exemplo.</p>
      <button class="btn btn-danger" id="cfg-reset">Restaurar dados de demonstração</button></section>
  </div>`;
  $('#cfg-falha', p).onchange = e => { DB.data.config.simularFalha = e.target.checked; DB.auditar('Simulação de falha', e.target.checked ? 'ativada' : 'desativada'); DB.salvar(); toast(e.target.checked ? 'Falha simulada ativada.' : 'Falha simulada desativada.', 'ok'); };
  $('#cfg-reset', p).onclick = async () => {
    if (!await confirmar('Restaurar dados de demonstração?', 'Todos os usuários, checagens e fontes deste navegador serão apagados e recriados. Você sairá da conta.', 'Restaurar', true)) return;
    try { localStorage.removeItem(KEY_DB); } catch (e) {}
    encerrarSessao(); await criarDadosDemo(); toast('Dados de demonstração restaurados.', 'ok'); ir('#/login');
  };
}

/* ----- Sobre / roteiro de apresentação ----- */

  return { titulo: 'Sobre', html: `
  <div class="page-head" style="display:flex;gap:16px;align-items:center">${mascote(64)}<div><h1 tabindex="-1" style="margin:0">Sobre a Ptolomy.AI</h1><p class="muted" style="margin:0">Projeto acadêmico de checagem de fatos</p></div></div>
  <div class="two" style="margin-top:18px">
    <section class="card"><h2>O problema</h2><p>Notícias falsas se espalham rápido, e assistentes de IA às vezes produzem respostas convincentes, mas erradas (as chamadas “alucinações”). Sem saber de onde vem a informação, fica difícil decidir em que confiar.</p>
      <h2 style="margin-top:18px">A proposta</h2><p>A Ptolomy.AI recebe uma afirmação, procura evidências, mostra cada fonte com seu tipo e posição e calcula um score de confiabilidade explicado. É uma ferramenta de apoio: não é uma autoridade infalível.</p></section>
    <section class="card"><h2>Como o score é calculado</h2>
      <div class="table-wrap"><table><thead><tr><th scope="col">Regra</th><th scope="col">Efeito</th></tr></thead><tbody>
      ${linhaPeso('Ponto de partida', '50 (incerteza neutra)')}${linhaPeso('Fonte oficial confirmando', '+30')}${linhaPeso('Fonte acadêmica confirmando', '+20')}${linhaPeso('Imprensa confiável confirmando', '+15')}${linhaPeso('Fonte contradizendo', 'subtrai o mesmo peso')}${linhaPeso('Fonte neutra', '0')}${linhaPeso('Mesmo domínio repetido', 'conta uma vez só')}${linhaPeso('Limite', '0 a 100')}${linhaPeso('Saúde, Finanças ou Eleições', 'verde só com 3+ fontes oficiais')}
      </tbody></table></div>
      <p class="hint" style="margin-top:10px">Faixas: 70–100 confiável · 40–69 duvidoso / precisa de contexto · 0–39 provavelmente falso ou sem base.</p></section>
  </div>
  <section class="card" style="margin-top:18px"><h2>Roteiro de demonstração</h2>
    <p class="muted">Contas temporárias (senha <code>${SENHA_DEMO}</code>): aluno@ptolomy.demo (comum), maria@ptolomy.demo (comum) e admin@ptolomy.demo (administrador).</p>
    <ol>
      <li>Entrar como <strong>aluno</strong> e verificar “O Sol é uma estrela.” → resultado verde com evidências concordantes.</li>
      <li>Verificar “Vitamina C previne gripe e resfriado.” → amarelo, com alerta de controvérsia.</li>
      <li>Verificar “Investir em bitcoin é garantia de lucro.” → vermelho, contradito por fontes oficiais.</li>
      <li>Verificar “As urnas eletrônicas passam por testes públicos de segurança organizados pelo TSE.” → tema sensível com só 1 fonte oficial: selo verde bloqueado.</li>
      <li>Abrir o <strong>Histórico</strong>, filtrar por tema e cor, e abrir um detalhe.</li>
      <li>Abrir o <strong>Painel</strong> e comentar a distribuição dos resultados.</li>
      <li>Logado como aluno, <a href="#/checagem/chk-maria-001">tentar abrir uma checagem da Maria</a> → acesso negado.</li>
      <li>Entrar como <strong>admin</strong> e mudar o peso de uma fonte em Administração → Fontes confiáveis.</li>
      <li>Ver o painel “Plataforma (agregado)”: só números, sem textos de outros usuários.</li>
      <li>Em Administração → Demonstração, ativar a falha simulada e mostrar a mensagem de indisponibilidade.</li>
    </ol></section>
  <div class="two" style="margin-top:18px">

/* =========================================================================
   ROTEADOR E LAYOUT
   ========================================================================= */
const ROTAS = [
  { rx: /^\/login$/, view: vLogin, publica: true, soVisitante: true },
  { rx: /^\/cadastro$/, view: vCadastro, publica: true, soVisitante: true },
  { rx: /^\/esqueci$/, view: vEsqueci, publica: true, soVisitante: true },
  { rx: /^\/redefinir$/, view: vRedefinir, publica: true, soVisitante: true },
  { rx: /^\/sobre$/, view: vSobre, publica: true },
  { rx: /^\/checar$/, view: vChecar },
  { rx: /^\/historico$/, view: vHistorico },
  { rx: /^\/checagem\/([\w-]+)$/, view: vDetalhe },
  { rx: /^\/painel$/, view: vPainel },
  { rx: /^\/perfil$/, view: vPerfil },
  { rx: /^\/admin$/, view: vAdmin, admin: true },
];
const ir = h => { if (location.hash === h) render(); else location.hash = h; };

function cabecalho(u, caminho) {
  const links = u
    ? [['#/checar', 'Verificar', '/checar'], ['#/historico', 'Histórico', '/historico'], ['#/painel', 'Painel', '/painel'], ...(u.tipo === 'admin' ? [['#/admin', 'Administração', '/admin']] : []), ['#/sobre', 'Sobre', '/sobre']]
    : [['#/login', 'Entrar', '/login'], ['#/cadastro', 'Criar conta', '/cadastro'], ['#/sobre', 'Sobre', '/sobre']];
  const atual = caminho.startsWith('/checagem/') ? '/historico' : caminho;
  const iniciais = u ? u.nome.split(' ').filter(Boolean).slice(0, 2).map(p => p[0].toUpperCase()).join('') : '';
  return `<header class="top"><div class="top-in">
    <a class="brand" href="${u ? '#/checar' : '#/login'}" aria-label="Ptolomy.AI — início">${mascote(34, '')}<span>Ptolomy<span class="ai">.AI</span></span></a>
    <button class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="nav-principal">☰ Menu</button>
    <nav class="main" id="nav-principal" aria-label="Navegação principal">
      ${links.map(([h, t, c]) => `<a href="${h}" ${atual === c ? 'aria-current="page"' : ''}>${t}</a>`).join('')}
      ${u ? `<span class="user-chip"><a href="#/perfil" ${atual === '/perfil' ? 'aria-current="page"' : ''} title="Meu perfil"><span class="avatar" aria-hidden="true">${esc(iniciais)}</span>&nbsp;<span>${esc(u.nome.split(' ')[0])}</span><span class="sr-only"> — meu perfil</span></a><button class="navbtn" id="btn-sair">Sair</button></span>` : ''}
    </nav>
  </div></header>
  <div class="demo-banner" role="note">Modo demonstração: as verificações usam uma base local de exemplo e os dados ficam salvos só neste navegador.</div>`;
}

function render() {
  const caminho = (location.hash || '').replace(/^#/, '') || '/';
  const u = usuarioAtual();
  if (caminho === '/') { ir(u ? '#/checar' : '#/login'); return; }
  let rota = null, params = [];
  for (const r of ROTAS) { const mm = caminho.match(r.rx); if (mm) { rota = r; params = mm.slice(1); break; } }
  let v;
  if (!rota) v = vMensagem('Página não encontrada', 'O endereço que você abriu não existe.', `<a class="btn btn-primary" href="${u ? '#/checar' : '#/login'}">Ir para o início</a>`);
  else if (!rota.publica && !u) { try { sessionStorage.setItem('ptolomy_voltar', '#' + caminho); } catch (e) {} ir('#/login'); return; }
  else if (rota.soVisitante && u) { ir('#/checar'); return; }
  else if (rota.admin && u.tipo !== 'admin') {
    DB.auditar('Acesso negado', 'Usuário comum tentou abrir a área administrativa'); DB.salvar();
    v = vMensagem('Acesso negado', 'Esta área é restrita a administradores.', '<a class="btn btn-primary" href="#/checar">Voltar</a>', '🔒');
  }
  else v = rota.view(...params.map(decodeURIComponent));
  if (u) { iniciarSessao(u); ultimaRenovacao = Date.now(); }

  const app = $('#app');
  app.innerHTML = cabecalho(u, caminho) + `<main id="main" tabindex="-1">${v.html}</main><footer class="foot">Ptolomy.AI · Projeto acadêmico de checagem de fatos · Protótipo em modo demonstração</footer>`;
  document.title = `${v.titulo || 'Ptolomy.AI'} · Ptolomy.AI`;
  const tg = $('#menu-toggle'), nav = $('#nav-principal');
  tg.onclick = () => { const ab = nav.classList.toggle('open'); tg.setAttribute('aria-expanded', ab); };
  const sair = $('#btn-sair');
  if (sair) sair.onclick = () => { encerrarSessao(); toast('Você saiu da sua conta.'); ir('#/login'); };
  if (v.montar) v.montar($('#main'));
  const h1 = $('main h1'); if (h1) { h1.setAttribute('tabindex', '-1'); h1.focus({ preventScroll: true }); }
  window.scrollTo(0, 0);
}

/* ---------- Inicialização ---------- */
async function iniciar() {
  $('#app').innerHTML = `<main style="text-align:center;padding:80px 16px" aria-busy="true">${mascote(72)}<p class="muted">Preparando a Ptolomy.AI…</p></main>`;
  if (!DB.carregar() || !DB.data.usuarios) await criarDadosDemo();
  DB.data.config = DB.data.config || { simularFalha: false };
  window.addEventListener('hashchange', render);
  ['click', 'keydown'].forEach(ev => document.addEventListener(ev, renovarSessao, { passive: true }));
  setInterval(() => { if (lerSessao() && !usuarioAtual()) render(); }, 60000); // detecta sessão expirada
  render();
}
iniciar().catch(err => { console.error(err); $('#app').innerHTML = '<main><div class="alert alert-danger" role="alert"><p>Não foi possível iniciar a aplicação neste navegador.</p></div></main>'; });

})();
</script>
</body>
</html>
